<!DOCTYPE html>

<head>
    <title>
    </title>

    <link rel="stylesheet" href="../css/custom.css">
</head>

<body>
<main>
    <script src="/Project_1/include-nav.js"></script>
    <!-- Include nav.html -->
    <div data-include="/Project_1/docs/nav.html"></div>
    

    <div class="container">

        <!-- primary color palette -->
        <div class="color-palette">
            <h2>Primary colours</h2>
            <section class="swatches">
                <div class="swatch">
                    <div class="primary-black"></div>
                    primary-black
                </div>
                <div class="swatch">
                    <div class="primary-dark"></div>
                    primary-dark
                </div>
                <div class="swatch">
                    <div class="primary-light"></div>
                    primary-light
                </div>
                <div class="swatch">
                    <div class="primary-light-100"></div>
                    primary-light-100
                </div>
            </section>
        </div>

         <!-- secondary color palette -->
         <div class="color-palette">
            <h2>Secondary colours</h2>
            <section class="swatches">
                <div class="swatch">
                    <div class="secondary-dark"></div>
                    secondary-dark
                </div>
                <div class="swatch">
                    <div class="secondary-light"></div>
                    secondary-light
                </div>
                <div class="swatch">
                    <div class="secondary-light-100"></div>
                    secondary-light-100
                </div>
            </section>
        </div>

        <!-- neutral color palette -->
        <div class="color-palette">
            <h2>Neutral colours</h2>
            <section class="swatches">
                <div class="swatch">
                    <div class="neutral-dark"></div>
                    neutral-dark
                </div>

                <div class="swatch">
                    <div class="neutral-light"></div>
                    neutral-light
                </div>

                <div class="swatch">
                    <div class="neutral-white"></div>
                    neutral-white
                </div>
            </section>
        </div>

    </div>
